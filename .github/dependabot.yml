# Weekly dependency updates. Minor and patch updates of one ecosystem arrive as a single pull request, so they are easy to review;
# a major update gets its own. The CI of each pull request (lint, typecheck, unit tests, build, end-to-end) is the safety net.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
